<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Calidraw — hand-drawn canvas</title>
    <meta name="title" content="Calidraw — hand-drawn canvas" />
    <meta name="description" content="A quiet, offline hand-drawn canvas. Pick a tool and draw — no account, nothing to prove." />
    <meta property="og:title" content="calidraw" />
    <meta property="og:description" content="hand-drawn style canvas. rough.js, react, vite." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
  </head>
  <body class="m-0 p-0 overflow-hidden">
    <script>
      try {
        var t = localStorage.getItem('calidraw-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
